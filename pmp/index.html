<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>محاكي اختبار PMP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D4A73'/%3E%3Ctext x='32' y='46' font-size='38' font-weight='700' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* التخطيط: شاشة اختبار بثلاثة أشرطة ثابتة (معلومات، أدوات، تنقل) ومنطقة سؤال قابلة للتمرير، وصفحة رئيسية بعمودين */
:root{
  --bg:#EDF0F3;
  --surface:#FFFFFF;
  --surface-2:#F5F7F9;
  --ink:#16202B;
  --muted:#5B6776;
  --line:#D3DAE2;
  --brand:#1D4A73;
  --brand-2:#2A6198;
  --brand-ink:#FFFFFF;
  --tool:#DCE3EA;
  --accent:#B86E0C;
  --accent-soft:#FBEBD3;
  --ok:#1F7A49;
  --ok-soft:#DDF1E5;
  --bad:#B13636;
  --bad-soft:#F7E0E0;
  --hl:#FFE27A;
  --hl-ink:#16202B;
  --sel:#E3EEF9;
  --shadow:0 12px 32px -14px rgba(18,38,60,.35);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --qsize:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A;--surface:#161F28;--surface-2:#1C2631;--ink:#E5EBF1;--muted:#97A5B4;--line:#2B3743;
    --brand:#16395A;--brand-2:#245584;--brand-ink:#F2F6FA;--tool:#1F2B37;--accent:#E3A341;--accent-soft:#3A2C17;
    --ok:#5CC68B;--ok-soft:#173226;--bad:#EC7C7C;--bad-soft:#3A1E21;--hl:#7D6418;--hl-ink:#FFF6D8;--sel:#1E3550;
    --shadow:0 12px 32px -14px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A;--surface:#161F28;--surface-2:#1C2631;--ink:#E5EBF1;--muted:#97A5B4;--line:#2B3743;
  --brand:#16395A;--brand-2:#245584;--brand-ink:#F2F6FA;--tool:#1F2B37;--accent:#E3A341;--accent-soft:#3A2C17;
  --ok:#5CC68B;--ok-soft:#173226;--bad:#EC7C7C;--bad-soft:#3A1E21;--hl:#7D6418;--hl-ink:#FFF6D8;--sel:#1E3550;
  --shadow:0 12px 32px -14px rgba(0,0,0,.7);color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
#root{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.75;direction:rtl;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- أزرار ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 18px;border-radius:6px;font-weight:600;font-size:15px;line-height:1.4;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(1.08);background:var(--bad)}
.btn-lg{padding:13px 26px;font-size:17px}
.btn svg{width:18px;height:18px;flex:none}

/* ================= الصفحة الرئيسية ================= */
.page{min-height:100%;display:flex;flex-direction:column}
.band{background:var(--brand);color:var(--brand-ink)}
.wrap{
  max-width:1080px;margin:0 auto;width:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.band .wrap{padding-block:34px 92px}
.brand-logo{display:block;max-height:52px;max-width:200px;width:auto;margin-bottom:14px}
.xbar .brand-logo{display:inline-block;max-height:30px;max-width:120px;margin:0 0 0 12px;vertical-align:middle}
.eyebrow{font-size:13px;letter-spacing:.04em;opacity:.8;font-weight:600}
.band h1{font-size:clamp(28px,4.6vw,42px);font-weight:700;margin-top:6px}
.band p.lead{font-size:17px;opacity:.88;margin-top:8px;max-width:60ch}
.home-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;margin-top:-64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:20px;margin-bottom:14px}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label{font-weight:600;font-size:14.5px}
.input{
  width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;
  padding:11px 14px;font-size:16px;
}
.input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--sel)}
.modes{display:grid;gap:10px;margin-bottom:20px}
.mode{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--surface);
}
.mode:hover{background:var(--surface-2)}
.mode input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.mode b{display:block;font-size:16px}
.mode small{color:var(--muted);font-size:13.5px}
.mode .meta{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:left}
.mode:has(input:checked){border-color:var(--brand-2);background:var(--sel)}
.note{font-size:13.5px;color:var(--muted);margin-top:12px}
.resume{
  border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-bottom:18px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
}
.resume p{flex:1 1 220px;font-size:14.5px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.fact b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:600;color:var(--brand-2);line-height:1.2}
:root[data-theme="dark"] .fact b{color:var(--ink)}
.fact span{font-size:13px;color:var(--muted)}
.dom-row{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;align-items:center;gap:10px;margin-bottom:10px;font-size:14.5px}
.dom-bar{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.dom-bar i{display:block;height:100%;background:var(--brand-2)}
.dom-row .pct{font-family:var(--f-mono);font-size:13.5px;text-align:left}
.sec-title{font-size:20px;margin:36px 0 14px}
.acc{display:grid;gap:8px}
.acc details{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.acc summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:18px}
.acc details[open] summary::after{content:"−"}
.acc .acc-body{padding:0 18px 16px;color:var(--muted);max-width:75ch}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:13.5px}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:18px;color:var(--muted);font-size:14.5px;text-align:center}
.foot{margin-top:auto;padding-block:28px;color:var(--muted);font-size:13px}
.err{color:var(--bad);font-size:13.5px;margin-top:-10px;margin-bottom:14px}

/* ================= إطار الاختبار ================= */
.app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.xbar{
  background:var(--brand);color:var(--brand-ink);
  padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;
}
.xbar .x-title{font-family:var(--f-display);font-weight:600;font-size:16px;margin-inline-end:auto;min-width:0}
.xbar .x-title small{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;opacity:.8}
.x-info{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:14px}
.x-info .num{font-family:var(--f-mono);font-weight:600}
.timer{
  display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
  color:var(--brand-ink);border-radius:6px;padding:5px 12px;font-size:14px;
}
.timer .num{font-family:var(--f-mono);font-size:16px;font-weight:600;letter-spacing:.02em}
.timer.warn{background:#C0392B;border-color:#C0392B}
.timer svg{width:16px;height:16px}
.tools{
  background:var(--tool);border-bottom:1px solid var(--line);
  padding-block:6px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  padding:6px 11px;border-radius:5px;font-size:14px;font-weight:500;color:var(--ink);
}
.tbtn:hover{background:var(--surface)}
.tbtn[aria-pressed="true"]{background:var(--surface);border-color:var(--brand-2);color:var(--brand-2)}
:root[data-theme="dark"] .tbtn[aria-pressed="true"]{color:var(--ink)}
.tbtn.flag[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tbtn svg{width:17px;height:17px;flex:none}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.tsep{width:1px;height:22px;background:var(--line);margin-inline:4px}
.tools .spacer{margin-inline-start:auto}
.xmain{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.xmain .inner{
  max-width:920px;margin:0 auto;padding-block:26px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  font-size:calc(17px * var(--qsize));
}
.xfoot{
  background:var(--surface);border-top:1px solid var(--line);
  padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.xfoot .mid{flex:1;display:flex;justify-content:center;min-width:0}
.prog{width:min(320px,100%);height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand-2)}

/* ---------- السؤال ---------- */
.q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:.82em}
.q-head .qn{font-family:var(--f-display);font-weight:600;color:var(--ink);font-size:1.12em}
.q-head .flagged{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.q-head .flagged svg{width:15px;height:15px}
.stem{line-height:1.95;margin-bottom:10px;max-width:72ch}
.stem.hl-on{cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
.stem.hl-on mark{cursor:pointer}
.q-instr{font-size:.85em;font-weight:600;color:var(--brand-2);margin:14px 0 12px}
:root[data-theme="dark"] .q-instr{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q-instr{color:var(--ink)}}
.opts{display:grid;gap:10px}
.opt{
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:12px;
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;
  cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1.75;text-align:right;width:100%;
}
.opt:hover{border-color:var(--brand-2)}
.opt .mk{
  width:28px;height:28px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;
  font-weight:600;font-size:.82em;margin-top:1px;flex:none;
}
.opts.multi .opt .mk{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--brand-2);background:var(--sel)}
.opt[aria-checked="true"] .mk{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.opt.struck .txt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.opt.struck .mk{opacity:.5}
.strike-on .opt{cursor:crosshair}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px}
.mrow .mi{font-weight:600}
.mrow select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:9px 10px;font-size:.92em;line-height:1.5}
.fill input{max-width:260px;font-family:var(--f-mono);font-size:1.1em;text-align:left;direction:ltr}
.fill p{color:var(--muted);font-size:.85em;margin-top:8px}

/* ---------- الشرح والاتفاقية ---------- */
.doc{max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px}
.doc h2{font-size:1.3em;margin-bottom:14px}
.doc p,.doc li{line-height:1.95}
.doc p+p{margin-top:10px}
.doc ul{padding-inline-start:22px;margin:10px 0 0;display:grid;gap:6px}
.doc .pg{color:var(--muted);font-size:.8em;margin-bottom:6px}
.agree{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.agree label{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.agree input{width:18px;height:18px;accent-color:var(--brand)}

/* ---------- شاشة المراجعة ---------- */
.rv-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.rv-top h2{font-size:1.3em}
.rv-top p{color:var(--muted);font-size:.85em;max-width:62ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:.82em;font-weight:600}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{
  border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:9px 10px;text-align:right;
  display:grid;gap:2px;font-size:.82em;min-height:64px;
}
.tile:hover{border-color:var(--brand-2)}
.tile b{font-family:var(--f-mono);font-size:1.15em}
.tile .st{color:var(--muted);font-size:.9em;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tile.inc{border-style:dashed;border-color:var(--muted)}
.tile.inc .st{color:var(--bad)}
.tile.fl{box-shadow:inset -4px 0 0 var(--accent)}
.tile .st svg{width:13px;height:13px;color:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.8em;margin-top:16px}
.rv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* ---------- الاستراحة ---------- */
.center{flex:1;display:grid;place-items:center;padding-block:30px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.break-card{max-width:520px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 26px;box-shadow:var(--shadow)}
.break-card h2{font-size:24px}
.break-card p{color:var(--muted);margin-top:8px}
.big-time{font-family:var(--f-mono);font-size:56px;font-weight:600;color:var(--brand-2);margin:18px 0 6px;line-height:1.1}
:root[data-theme="dark"] .big-time{color:var(--ink)}
.break-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* ---------- النتائج ---------- */
.res-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.verdict{font-size:clamp(26px,4vw,36px);font-weight:700}
.score-ring{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;position:relative}
.score-ring b{font-family:var(--f-mono);font-size:30px;font-weight:600;color:var(--brand-ink)}
.score-ring small{display:block;font-size:12px;opacity:.85;text-align:center}
.report{display:grid;gap:18px}
.rp-row{display:grid;gap:8px}
.rp-row .rp-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px}
.rp-row .rp-h b{font-family:var(--f-display);font-weight:600}
.rp-row .rp-h span{color:var(--muted);font-size:14px}
.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.bands div{
  border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:7px 4px;text-align:center;
  font-size:12.5px;color:var(--muted);line-height:1.35;
}
.bands div.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.bands div.on.r-needs,.bands div.on.r-below{background:var(--bad);border-color:var(--bad);color:#fff}
.bands div.on.r-above,.bands div.on.r-target{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bands div.on.r-above,:root:not([data-theme="light"]) .bands div.on.r-target{color:#0E141A}}
:root[data-theme="dark"] .bands div.on.r-above,:root[data-theme="dark"] .bands div.on.r-target{color:#0E141A}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600}
.stat span{color:var(--muted);font-size:13px}
.ans-list{display:grid;gap:12px}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;border-inline-start:5px solid var(--line)}
.ans.ok{border-inline-start-color:var(--ok)}
.ans.bad{border-inline-start-color:var(--bad)}
.ans .ah{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.ans .ah b{color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:15px}
.ans .aq{line-height:1.9;margin-bottom:10px;max-width:75ch}
.ans ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ans li{border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.ans li .tag{margin-inline-start:auto;font-size:12px;font-weight:600;white-space:nowrap}
.ans li.correct{border-color:var(--ok);background:var(--ok-soft)}
.ans li.correct .tag{color:var(--ok)}
.ans li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans li.wrong .tag{color:var(--bad)}
.ans .ex{margin-top:12px;background:var(--surface-2);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.9;color:var(--ink)}
.ans .ex b{color:var(--brand-2)}
:root[data-theme="dark"] .ans .ex b{color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:14px}

/* ---------- الحاسبة ---------- */
.calc{
  position:fixed;z-index:60;width:256px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.45);overflow:hidden;touch-action:none;
}
.calc-h{background:var(--brand);color:var(--brand-ink);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;cursor:move;font-size:14px;font-weight:600}
.calc-h button{background:transparent;border:0;color:inherit;font-size:20px;line-height:1;padding:0 4px}
.calc-d{font-family:var(--f-mono);font-size:26px;text-align:left;direction:ltr;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calc-d small{display:block;font-size:12px;color:var(--muted);min-height:16px}
.calc-k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;direction:ltr}
.calc-k button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 0;font-family:var(--f-mono);font-size:16px;font-weight:600}
.calc-k button:hover{background:var(--surface-2)}
.calc-k button.op{background:var(--sel)}
.calc-k button.eq{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- نوافذ وتنبيهات ---------- */
.modal-back{position:fixed;inset:0;background:rgba(8,16,26,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal h3{font-size:19px;margin-bottom:10px}
.modal p{color:var(--muted);line-height:1.85}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.toast{
  position:fixed;z-index:90;top:calc(14px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);
  max-width:calc(100% - 32px);
}

@media (max-width:820px){
  .home-grid{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .mrow{grid-template-columns:minmax(0,1fr)}
  .tbtn .lbl{display:none}
  .tbtn{padding:7px 9px}
  .facts b{font-size:22px}
  .res-head{grid-template-columns:minmax(0,1fr)}
  .score-ring{width:104px;height:104px}
  .xbar .x-title small{display:none}
  .mode{grid-template-columns:auto 1fr}
  .mode .meta{grid-column:2;text-align:right}
  .doc{padding:20px}
  .tsep{display:none}
  .tools{gap:2px}
  .xfoot .mid{display:none}
  .xfoot{justify-content:space-between;gap:8px}
  .xfoot .btn{padding:9px 12px}
  .xfoot .btn .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="root" dir="rtl"></div>
<div id="calc" class="calc" hidden></div>
<div id="overlay"></div>

<script src="config.js"></script>
<script src="questions.js"></script>
<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

/* ================= البيانات والإعدادات ================= */
const CFG = window.PMP_CONFIG || {};
const EX = Object.assign({questions:185,minutes:240,sections:3,breakMinutes:10,passPercent:65,ndaMinutes:5,shuffleQuestions:true,shuffleOptions:true}, CFG.exam||{});
const DOMAINS = CFG.domains || {people:{label:'الأفراد',weight:33},process:{label:'العمليات',weight:41},business:{label:'بيئة الأعمال',weight:26}};
const RATINGS = (CFG.ratings||[]).slice().sort((a,b)=>b.min-a.min);
const MODES = CFG.modes || [{id:'full',label:'الاختبار الكامل',count:185,sections:3,breaks:true}];

const BANK = [];
(window.PMP_QUESTIONS||[]).forEach((q,i)=>{
  if(!q || !q.q) return;
  q = Object.assign({}, q);
  q.id = String(q.id!=null ? q.id : 'Q'+(i+1));
  if(!DOMAINS[q.domain]) q.domain = Object.keys(DOMAINS)[0];
  q.type = q.type || 'single';
  if(q.type==='multi' && !q.select) q.select = Array.isArray(q.answer)?q.answer.length:2;
  if(BANK.some(x=>x.id===q.id)) q.id += '_'+i;
  BANK.push(q);
});
const QMAP = Object.fromEntries(BANK.map(q=>[q.id,q]));

const K_SESSION='pmp-sim-session-v1', K_HIST='pmp-sim-history-v1', K_NAME='pmp-sim-name-v1', K_MODE='pmp-sim-mode-v1';
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ================= أدوات مساعدة ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>esc(s).replace(/\n/g,'<br>');
const LETTERS=['أ','ب','ج','د','هـ','و','ز','ح','ط','ي'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,'0');
function fmtTime(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+pad(m)+':'+pad(x)}
function fmtDur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);if(h)return h+' س '+m+' د';return m+' د'}
function fmtDate(t){try{return new Date(t).toLocaleDateString('ar-SA-u-nu-latn-ca-gregory',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return new Date(t).toISOString().slice(0,16).replace('T',' ')}}
function qCount(n){if(n===1)return 'سؤال واحد';if(n===2)return 'سؤالان';if(n>=3&&n<=10)return n+' أسئلة';return n+' سؤالًا'}
function pickN(n){if(n===1)return 'إجابة واحدة';if(n===2)return 'إجابتين';if(n<=10)return n+' إجابات';return n+' إجابة'}
function ratingFor(p){for(const r of RATINGS){if(p>=r.min)return r}return RATINGS[RATINGS.length-1]||{id:'needs',label:'—'}}

const ICON={
  calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h0M16 11h0M8 15h0M12 15h0M16 15v3M8 18h4" stroke-linecap="round"/></svg>',
  hl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4l5 5-9 9H6v-5l9-9z" stroke-linejoin="round"/><path d="M4 21h16" stroke-linecap="round"/></svg>',
  strike:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16M16 6.5C15 5 13.6 4.5 12 4.5c-2.5 0-4 1.3-4 3.2 0 1.2.7 2 2 2.6M8 17.5c1 1.5 2.4 2 4 2 2.5 0 4-1.3 4-3.2 0-.6-.2-1.2-.5-1.6"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  flagF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4h11l-2 4 2 4H6.6V21z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></svg>',
  eraser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 20h11M4.5 14.5l8-8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 18H8z"/></svg>',
  exit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M14 8l-4 4 4 4M10 12h10"/></svg>'
};

/* ================= الحالة ================= */
let S = store.get(K_SESSION);
if(S && (!S.qids || !S.qids.every(id=>QMAP[id]))) { S=null; store.del(K_SESSION); }
const ui={hl:false,strike:false,timerHidden:false,rvFilter:'all',resFilter:'all',resDomain:'all',homeErr:''};
let saveTimer=null;
function save(){ if(S) store.set(K_SESSION,S); }
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,300); }

function modeById(id){return MODES.find(m=>m.id===id)||MODES[0]}

function pickQuestions(n){
  const pool = EX.shuffleQuestions ? shuffle(BANK) : BANK.slice();
  if(n>=pool.length) return pool.map(q=>q.id);
  const keys=Object.keys(DOMAINS); const totalW=keys.reduce((a,k)=>a+(DOMAINS[k].weight||0),0)||1;
  const by={}; keys.forEach(k=>by[k]=pool.filter(q=>q.domain===k));
  const want={}; let sum=0;
  keys.forEach(k=>{want[k]=Math.min(by[k].length, Math.round(n*(DOMAINS[k].weight||0)/totalW)); sum+=want[k];});
  const chosen=[]; keys.forEach(k=>chosen.push(...by[k].slice(0,want[k])));
  if(chosen.length<n){ const rest=pool.filter(q=>!chosen.includes(q)); chosen.push(...rest.slice(0,n-chosen.length)); }
  const out = chosen.slice(0,n);
  return (EX.shuffleQuestions?shuffle(out):out.sort((a,b)=>BANK.indexOf(a)-BANK.indexOf(b))).map(q=>q.id);
}

function newSession(name, modeId){
  const mode=modeById(modeId);
  const count=Math.min(mode.count||EX.questions, BANK.length);
  const qids=pickQuestions(count);
  const nSec=Math.max(1,Math.min(mode.sections||1,count));
  const sections=[]; let start=0;
  for(let i=0;i<nSec;i++){const size=Math.round((count-start)/(nSec-i)); sections.push([start,start+size]); start+=size;}
  const time=Math.max(60,Math.round(EX.minutes*60*count/EX.questions));
  const optOrder={};
  qids.forEach(id=>{const q=QMAP[id]; if(q.options){const idx=q.options.map((_,i)=>i); optOrder[id]=EX.shuffleOptions?shuffle(idx):idx;}});
  return {v:1,name,modeId:mode.id,modeLabel:mode.label,breaks:!!mode.breaks,qids,optOrder,sections,sec:0,cur:0,
    answers:{},flags:{},strikes:{},hl:{},remaining:time,total:time,phase:'tutorial',tut:0,nda:EX.ndaMinutes*60,ndaChoice:null,
    brk:0,nav:null,fs:1,started:Date.now(),finished:null,endReason:null,result:null};
}

/* ================= التقييم ================= */
function isAnswered(q,a){
  if(a==null) return false;
  if(q.type==='multi') return Array.isArray(a) && a.length>=q.select;
  if(q.type==='match') return Array.isArray(a) && q.items.every((_,i)=>a[i]!=null && a[i]!=='');
  if(q.type==='fill') return String(a).trim()!=='';
  return true;
}
function isTouched(q,a){ if(a==null) return false; if(Array.isArray(a)) return a.some(x=>x!=null&&x!==''); return String(a).trim()!=='' }
function isCorrect(q,a){
  if(!isAnswered(q,a)) return false;
  if(q.type==='single') return Number(a)===Number(q.answer);
  if(q.type==='multi'){const c=(q.answer||[]).map(Number).sort().join(',');return a.map(Number).sort().join(',')===c}
  if(q.type==='match') return q.answer.every((t,i)=>Number(a[i])===Number(t));
  if(q.type==='fill'){const v=parseFloat(String(a).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،\s]/g,'').replace('٫','.'));return !isNaN(v)&&Math.abs(v-Number(q.answer))<=(q.tolerance||0)+1e-9}
  return false;
}
function computeResult(){
  const per={}; Object.keys(DOMAINS).forEach(k=>per[k]={total:0,correct:0});
  let correct=0, answered=0;
  S.qids.forEach(id=>{const q=QMAP[id],a=S.answers[id]; per[q.domain].total++; if(isAnswered(q,a))answered++; if(isCorrect(q,a)){correct++;per[q.domain].correct++;}});
  const total=S.qids.length, pct=total?Math.round(correct/total*1000)/10:0;
  return {total,correct,answered,pct,pass:pct>=EX.passPercent,per,flagged:Object.values(S.flags).filter(Boolean).length,
    timeUsed:S.total-S.remaining};
}

/* ================= الحفظ في السجل ================= */
/* ================= إرسال النتيجة إلى Google Sheets (اختياري) ================= */
const K_OUTBOX='pmp-sim-outbox-v1';
function sheetOn(){ return /^https:\/\//.test(CFG.sheetUrl||''); }
function postToSheet(payload){
  /* نص عادي بدون ترويسات خاصة حتى لا يحتاج المتصفح إلى طلب تحقق مسبق من جوجل */
  return fetch(CFG.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true});
}
function queueResult(p){ const b=store.get(K_OUTBOX)||[]; b.push(p); store.set(K_OUTBOX,b.slice(-20)); }
function buildPayload(){
  const R=S.result, per={};
  Object.keys(DOMAINS).forEach(k=>{const d=R.per[k]; per[k]=d&&d.total?d.correct+'/'+d.total:'—'});
  return {token:CFG.sheetToken||'',sid:String(S.started),time:new Date(S.finished).toISOString(),name:S.name,mode:S.modeLabel,
    total:R.total,correct:R.correct,pct:R.pct,result:R.pass?'ناجح':'غير ناجح',level:ratingFor(R.pct).label,
    seconds:R.timeUsed,ended:S.endReason,people:per.people,process:per.process,business:per.business,
    wrong:S.qids.filter(id=>!isCorrect(QMAP[id],S.answers[id])).join(' ')};
}
function submitResult(){ if(!sheetOn()) return; const p=buildPayload(); postToSheet(p).catch(()=>queueResult(p)); }
function flushOutbox(){
  if(!sheetOn()) return; const box=store.get(K_OUTBOX)||[]; if(!box.length) return; store.del(K_OUTBOX);
  box.forEach(p=>postToSheet(p).catch(()=>queueResult(p)));
}
window.addEventListener('online',flushOutbox);

function finishExam(reason){
  S.endReason=reason; S.finished=Date.now(); S.phase='results'; S.nav=null;
  S.result=computeResult();
  const h=store.get(K_HIST)||[];
  h.unshift({t:S.finished,name:S.name,mode:S.modeLabel,total:S.result.total,correct:S.result.correct,pct:S.result.pct,pass:S.result.pass,time:S.result.timeUsed});
  store.set(K_HIST,h.slice(0,30));
  ui.resFilter='all'; ui.resDomain='all'; closeCalc(); save(); render(); submitResult();
  if(reason==='time') toast('انتهى وقت الاختبار، وتم تسليم إجاباتك');
}

/* ================= المؤقت ================= */
let last=performance.now(), accum=0, saveTick=0;
setInterval(()=>{
  const now=performance.now(); accum+=(now-last)/1000; last=now;
  const whole=Math.floor(accum); if(!whole) return; accum-=whole;
  if(!S) return;
  if(S.phase==='exam'||S.phase==='review'){
    const before=S.remaining; S.remaining=Math.max(0,S.remaining-whole);
    if(before>300 && S.remaining<=300 && S.total>600) toast('تبقّى 5 دقائق على انتهاء الاختبار');
    if(S.remaining<=0){finishExam('time');return}
    paintTimer();
  } else if(S.phase==='break'){
    S.brk=Math.max(0,S.brk-whole); const el=$('#brkTime'); if(el) el.textContent=fmtTime(S.brk);
    if(S.brk<=0){endBreak();toast('انتهت الاستراحة، وبدأ القسم التالي');return}
  } else if(S.phase==='nda'){
    S.nda=Math.max(0,S.nda-whole); const el=$('#ndaTime'); if(el) el.textContent=fmtTime(S.nda);
    if(S.nda<=0){abortSession('انتهت مهلة قبول الاتفاقية، فتم إنهاء الاختبار.');return}
  } else return;
  if((saveTick+=whole)>=5){saveTick=0;save()}
},250);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
window.addEventListener('pagehide',save);

function paintTimer(){
  const t=$('#timer'); if(!t) return;
  t.classList.toggle('warn', S.remaining<=300);
  $('.num',t).textContent = ui.timerHidden ? '••:••' : fmtTime(S.remaining);
}

/* ================= العرض ================= */
const root=$('#root');
function logoHtml(){ return CFG.logo ? `<img class="brand-logo" src="${esc(CFG.logo)}" alt="" onerror="this.remove()">` : ''; }
if(CFG.logo){ const f=$('#favicon'); if(f) f.href=CFG.logo; }
function render(){
  if(!S || S.phase==='home') return renderHome();
  ({tutorial:renderTutorial,nda:renderNda,exam:renderExam,review:renderReview,break:renderBreak,results:renderResults}[S.phase]||renderHome)();
}

function xbar(extra){
  const total=S.qids.length;
  return `<header class="xbar">
    <div class="x-title">${logoHtml()}<span style="display:inline-block;vertical-align:middle">${esc(CFG.siteName||'محاكي اختبار PMP')}<small>${esc(S.name)} · ${esc(S.modeLabel)}</small></span></div>
    <div class="x-info">${extra||''}</div>
  </header>`;
}
function timerHtml(){
  return `<button class="timer" id="timer" type="button" title="انقر لإخفاء الوقت أو إظهاره" aria-label="الوقت المتبقي">${ICON.clock}<span>الوقت المتبقي</span><span class="num ltr">${ui.timerHidden?'••:••':fmtTime(S.remaining)}</span></button>`;
}
function bindTimer(){ const t=$('#timer'); if(t) t.onclick=()=>{ui.timerHidden=!ui.timerHidden;paintTimer()}; paintTimer(); }

/* ---------- الصفحة الرئيسية ---------- */
function renderHome(){
  const saved=store.get(K_SESSION);
  const hist=store.get(K_HIST)||[];
  const name=store.get(K_NAME)||'';
  const selMode=store.get(K_MODE)||MODES[0].id;
  const perQ=EX.minutes/EX.questions;
  const short = BANK.length < (modeById('full').count||EX.questions);
  const resumeHtml = saved && saved.phase!=='results' ? `<div class="resume">
      <p><b>لديك اختبار غير مكتمل</b> باسم ${esc(saved.name)} (${esc(saved.modeLabel)})، والوقت المتبقي ${fmtTime(saved.remaining)}.</p>
      <button class="btn btn-primary" id="resumeBtn" type="button">متابعة الاختبار</button>
      <button class="btn" id="discardBtn" type="button">حذفه</button></div>`
    : saved && saved.phase==='results' ? `<div class="resume"><p>نتيجتك الأخيرة جاهزة: ${saved.result?saved.result.pct:0}%.</p><button class="btn btn-primary" id="lastResBtn" type="button">عرض تقرير الأداء</button></div>` : '';
  root.innerHTML = `<div class="page">
    <section class="band"><div class="wrap">
      ${logoHtml()}
      <div class="eyebrow">Project Management Professional · صيغة 2026</div>
      <h1>${esc(CFG.siteName||'محاكي اختبار PMP')}</h1>
      <p class="lead">${esc(CFG.tagline||'')}</p>
    </div></section>
    <main class="wrap">
      <div class="home-grid">
        <form class="card" id="startForm" novalidate>
          <h2>بدء اختبار جديد</h2>
          ${resumeHtml}
          <div class="field"><label for="stName">اسم المتدرب</label>
            <input class="input" id="stName" autocomplete="name" placeholder="اكتب اسمك كما تريد أن يظهر في التقرير" value="${esc(name)}"></div>
          ${ui.homeErr?`<p class="err" role="alert">${esc(ui.homeErr)}</p>`:''}
          ${sheetOn()?`<p class="note" style="margin:-8px 0 16px">عند إنهاء الاختبار يُرسل اسمك ونتيجتك تلقائيًا إلى المدرّب.</p>`:''}

        </form>
        <aside class="card">
          <h2>الاختبار الفعلي بالأرقام</h2>
          <div class="facts">
            <div class="fact"><b class="num">${EX.questions}</b><span>سؤالًا</span></div>
            <div class="fact"><b class="num">${EX.minutes}</b><span>دقيقة</span></div>
            <div class="fact"><b class="num ltr">${Math.max(0,EX.sections-1)} × ${EX.breakMinutes}</b><span>استراحة بالدقائق</span></div>
          </div>
          <h2 style="font-size:16px">توزيع الأسئلة على المجالات</h2>
          ${Object.keys(DOMAINS).map(k=>`<div class="dom-row"><span>${esc(DOMAINS[k].label)}</span><span class="dom-bar"><i style="width:${DOMAINS[k].weight}%"></i></span><span class="pct num">${DOMAINS[k].weight}%</span></div>`).join('')}
          <p class="note">تقرير النتيجة يقيّم أداءك في كل مجال بأربعة مستويات: ${RATINGS.map(r=>esc(r.label)).join('، ')}.</p>
        </aside>
      </div>

      <h2 class="sec-title">تعليمات الاختبار</h2>
      <div class="acc">${(CFG.instructions||[]).map((it,i)=>`<details ${i===0?'open':''}><summary>${esc(it.title)}</summary><div class="acc-body">${txt(it.body)}</div></details>`).join('')}</div>

      <h2 class="sec-title">محاولاتك السابقة على هذا الجهاز</h2>
      <div class="table-wrap">${hist.length?`<table><thead><tr><th>التاريخ</th><th>الاسم</th><th>النوع</th><th>الدرجة</th><th>النتيجة</th><th>الوقت</th></tr></thead><tbody>
        ${hist.map(h=>`<tr><td class="num">${esc(fmtDate(h.t))}</td><td>${esc(h.name)}</td><td>${esc(h.mode)}</td><td class="num">${h.correct}/${h.total} (${h.pct}%)</td><td><span class="pill ${h.pass?'ok':'bad'}">${h.pass?'ناجح':'غير ناجح'}</span></td><td class="num">${fmtDur(h.time)}</td></tr>`).join('')}
        </tbody></table>`:`<div class="empty">لا توجد محاولات بعد. نتائجك تُحفظ هنا بعد كل اختبار.</div>`}</div>
    </main>
    <footer class="wrap foot">محاكاة تدريبية مستقلة لأغراض التعليم، وليست تابعة لمعهد إدارة المشاريع PMI. نسبة النجاح المعروضة تقديرية.</footer>
  </div>`;
  $('#startForm').onsubmit=e=>{
    e.preventDefault();
    const nm=$('#stName').value.trim(); const md=($('input[name=mode]:checked')||{}).value||MODES[0].id;
    if(!nm){ui.homeErr='اكتب اسمك أولًا ليظهر في تقرير الأداء.';renderHome();$('#stName').focus();return}
    if(!BANK.length){ui.homeErr='بنك الأسئلة فارغ. أضف أسئلة في ملف questions.js.';renderHome();return}
    ui.homeErr=''; store.set(K_NAME,nm); store.set(K_MODE,md);
    const go=()=>{S=newSession(nm,md);save();render();window.scrollTo(0,0)};
    if(saved && saved.phase!=='results') confirmBox('بدء اختبار جديد؟','سيُحذف الاختبار غير المكتمل المحفوظ على هذا الجهاز.',[{label:'إلغاء'},{label:'ابدأ اختبارًا جديدًا',kind:'primary',fn:go}]);
    else go();
  };
  const r=$('#resumeBtn'); if(r) r.onclick=()=>{S=saved;render()};
  const d=$('#discardBtn'); if(d) d.onclick=()=>confirmBox('حذف الاختبار غير المكتمل؟','لن تتمكن من استرجاع إجاباته.',[{label:'إلغاء'},{label:'حذف',kind:'danger',fn:()=>{store.del(K_SESSION);S=null;renderHome()}}]);
  const lr=$('#lastResBtn'); if(lr) lr.onclick=()=>{S=saved;render()};
}

  root.innerHTML=`<div class="app">${xbar(`<span>الشرح التعريفي</span><span class="num">صفحة ${S.tut+1} من ${n}</span>`)}
    <main class="xmain"><div class="inner"><article class="doc"><div class="pg">الشرح التعريفي · لا يُحسب من وقت الاختبار</div><h2>${esc(p.title)}</h2>${p.html||''}</article></div></main>
    <footer class="xfoot">
      <button class="btn" id="tPrev" type="button" ${S.tut===0?'disabled':''}>${ICON.prev}السابق</button>

      ${S.tut<n-1?`<button class="btn" id="tSkip" type="button">إنهاء الشرح</button><button class="btn btn-primary" id="tNext" type="button">التالي${ICON.next}</button>`
        :`<button class="btn btn-primary" id="tSkip" type="button">إنهاء الشرح${ICON.next}</button>`}

function abortSession(msg){ store.del(K_SESSION); S=null; closeCalc(); renderHome(); if(msg) toast(msg); }

/* ---------- شاشة السؤال ---------- */
function currentQ(){return QMAP[S.qids[S.cur]]}
function renderExam(){
  const q=currentQ(), id=q.id, a=S.answers[id], total=S.qids.length, [s0,s1]=S.sections[S.sec];
  const flagged=!!S.flags[id], struck=S.strikes[id]||[];
  const hasHl=!!S.hl[id];
  let body='', instr='';
  if(q.type==='single'||q.type==='multi'){
    const order=S.optOrder[id]||q.options.map((_,i)=>i), multi=q.type==='multi';
    instr = multi?`اختر ${pickN(q.select)}.`:'اختر إجابة واحدة.';
    body=`<div class="opts ${multi?'multi':''} ${ui.strike?'strike-on':''}" role="${multi?'group':'radiogroup'}" aria-label="الخيارات">${order.map((oi,pos)=>{
      const on=multi?(Array.isArray(a)&&a.includes(oi)):a===oi;
      return `<div class="opt ${struck.includes(oi)?'struck':''}" role="${multi?'checkbox':'radio'}" tabindex="0" aria-checked="${on}" data-i="${oi}">
        <span class="mk">${LETTERS[pos]||pos+1}</span><span class="txt">${txt(q.options[oi])}</span></div>`}).join('')}</div>`;
  } else if(q.type==='match'){
    instr='اختر لكل عنصر الوصف المناسب له من القائمة.';
    const tOrder=S.optOrder[id+'#t']||(S.optOrder[id+'#t']=EX.shuffleOptions?shuffle(q.targets.map((_,i)=>i)):q.targets.map((_,i)=>i));
    body=`<div class="match">${q.items.map((it,i)=>`<div class="mrow"><label class="mi" for="m-${i}">${txt(it)}</label>
      <select id="m-${i}" data-i="${i}"><option value="">— اختر —</option>${tOrder.map(t=>`<option value="${t}" ${Array.isArray(a)&&String(a[i])===String(t)?'selected':''}>${esc(q.targets[t])}</option>`).join('')}</select></div>`).join('')}</div>`;
  } else if(q.type==='fill'){
    instr='اكتب إجابتك الرقمية في المربع.';
    body=`<div class="fill"><input class="input" id="fillIn" inputmode="decimal" autocomplete="off" aria-label="الإجابة" value="${esc(a==null?'':a)}"><p>استخدم الأرقام والفاصلة العشرية فقط.</p></div>`;
  }
  const inNav=!!S.nav;
  const isFirst = inNav ? S.nav.list.indexOf(S.cur)<=0 : S.cur<=s0;
  const isLast = inNav ? S.nav.list.indexOf(S.cur)===S.nav.list.length-1 : S.cur>=s1-1;
  const answeredCount=S.qids.filter(x=>isAnswered(QMAP[x],S.answers[x])).length;

  root.innerHTML=`<div class="app">${xbar(`<span>القسم <span class="num">${S.sec+1}</span> من <span class="num">${S.sections.length}</span></span><span>السؤال <span class="num">${S.cur+1}</span> من <span class="num">${total}</span></span>${timerHtml()}`)}
    <div class="tools" role="toolbar" aria-label="أدوات الاختبار">
      <button class="tbtn" id="bCalc" type="button" aria-pressed="${!$('#calc').hidden}">${ICON.calc}<span class="lbl">الآلة الحاسبة</span></button>
      <button class="tbtn" id="bHl" type="button" aria-pressed="${ui.hl}">${ICON.hl}<span class="lbl">تظليل</span></button>
      <button class="tbtn" id="bClr" type="button" ${hasHl?'':'disabled'} title="إزالة التظليل من هذا السؤال">${ICON.eraser}<span class="lbl">إزالة التظليل</span></button>
      ${(q.type==='single'||q.type==='multi')?`<button class="tbtn" id="bStrike" type="button" aria-pressed="${ui.strike}">${ICON.strike}<span class="lbl">شطب</span></button>`:''}
      <span class="tsep"></span>
      <button class="tbtn flag" id="bFlag" type="button" aria-pressed="${flagged}">${flagged?ICON.flagF:ICON.flag}<span class="lbl">تعليم للمراجعة</span></button>
      <span class="tsep"></span>
      <button class="tbtn" id="bFsDown" type="button" aria-label="تصغير الخط" title="تصغير الخط"><span style="font-size:13px;font-weight:700">ص-</span></button>
      <button class="tbtn" id="bFsUp" type="button" aria-label="تكبير الخط" title="تكبير الخط"><span style="font-size:16px;font-weight:700">ص+</span></button>
      <span class="spacer"></span>
      <button class="tbtn" id="bEnd" type="button">${ICON.exit}<span class="lbl">إنهاء الاختبار</span></button>
    </div>
    <main class="xmain" id="xmain" style="--qsize:${S.fs||1}"><div class="inner">
      <div class="q-head"><span class="qn">السؤال ${S.cur+1}</span>${flagged?`<span class="flagged">${ICON.flagF}معلّم للمراجعة</span>`:''}</div>
      <div class="stem ${ui.hl?'hl-on':''}" id="qStem">${S.hl[id]||txt(q.q)}</div>
      <p class="q-instr">${instr}</p>
      ${body}
    </div></main>
    <footer class="xfoot">
      <button class="btn" id="bPrev" type="button" ${isFirst?'disabled':''}>${ICON.prev}السابق</button>
      <div class="mid"><div class="prog" title="الأسئلة المجابة: ${answeredCount} من ${total}"><i style="width:${answeredCount/total*100}%"></i></div></div>
      <button class="btn" id="bReview" type="button">${ICON.grid}<span class="lbl">${inNav?'العودة لشاشة المراجعة':'شاشة المراجعة'}</span></button>
      <button class="btn btn-primary" id="bNext" type="button">التالي${ICON.next}</button>
    </footer></div>`;
  bindTimer(); bindExam(q);
}

function bindExam(q){
  const id=q.id;
  $('#bCalc').onclick=()=>{toggleCalc();$('#bCalc').setAttribute('aria-pressed',String(!$('#calc').hidden))};
  $('#bHl').onclick=()=>{ui.hl=!ui.hl;if(ui.hl)ui.strike=false;renderExam()};
  $('#bClr').onclick=()=>{delete S.hl[id];saveSoon();renderExam()};
  const st=$('#bStrike'); if(st) st.onclick=()=>{ui.strike=!ui.strike;if(ui.strike)ui.hl=false;renderExam()};
  $('#bFlag').onclick=toggleFlag;
  $('#bFsDown').onclick=()=>setFs(-0.1);
  $('#bFsUp').onclick=()=>setFs(0.1);
  $('#bEnd').onclick=()=>{
    const un=S.qids.filter(x=>!isAnswered(QMAP[x],S.answers[x])).length;
    confirmBox('إنهاء الاختبار الآن؟',`سيتم تسليم الاختبار كاملًا وعرض النتيجة. ${un?`لديك ${qCount(un)} دون إجابة مكتملة وستُحتسب خاطئة.`:''}`,[{label:'متابعة الاختبار'},{label:'إنهاء وتسليم',kind:'danger',fn:()=>finishExam('manual')}]);
  };
  $('#bPrev').onclick=goPrev; $('#bNext').onclick=goNext; $('#bReview').onclick=openReview;

  $$('.opt').forEach(el=>{
    const oi=Number(el.dataset.i);
    el.addEventListener('click',()=>{ if(ui.strike) toggleStrike(oi); else choose(q,oi); });
    el.addEventListener('contextmenu',e=>{e.preventDefault();toggleStrike(oi)});
    el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();ui.strike?toggleStrike(oi):choose(q,oi)}});
  });
  $$('.match select').forEach(sel=>sel.onchange=()=>{
    const arr=Array.isArray(S.answers[id])?S.answers[id].slice():new Array(q.items.length).fill(null);
    arr[Number(sel.dataset.i)]=sel.value===''?null:Number(sel.value); S.answers[id]=arr; saveSoon(); paintProg();
  });
  const fi=$('#fillIn'); if(fi) fi.oninput=()=>{S.answers[id]=fi.value;saveSoon();paintProg()};

  const stem=$('#qStem');
  const hlUp=()=>{ if(ui.hl) setTimeout(()=>doHighlight(stem,id),10); };
  stem.addEventListener('mouseup',hlUp); stem.addEventListener('touchend',hlUp);
  stem.addEventListener('click',e=>{
    if(!ui.hl) return; const m=e.target.closest('mark'); if(!m) return;
    const sel=window.getSelection(); if(sel && !sel.isCollapsed) return;
    m.replaceWith(...m.childNodes); stem.normalize(); storeHl(stem,id);
  });
}
function paintProg(){
  const total=S.qids.length, n=S.qids.filter(x=>isAnswered(QMAP[x],S.answers[x])).length;
  const p=$('.xfoot .prog i'); if(p) p.style.width=(n/total*100)+'%';
}
function choose(q,oi){
  const id=q.id;
  if(q.type==='multi'){
    let a=Array.isArray(S.answers[id])?S.answers[id].slice():[];
    if(a.includes(oi)) a=a.filter(x=>x!==oi);
    else { if(a.length>=q.select){toast(`يمكنك اختيار ${pickN(q.select)} فقط. ألغِ أحد اختياراتك أولًا.`);return} a.push(oi); }
    S.answers[id]=a;
  } else S.answers[id]=oi;
  if(S.strikes[id]) S.strikes[id]=S.strikes[id].filter(x=>x!==oi);
  saveSoon();
  const cur=S.answers[id];
  $$('.opt').forEach(el=>{const i=Number(el.dataset.i);el.setAttribute('aria-checked',String(q.type==='multi'?cur.includes(i):cur===i));el.classList.toggle('struck',(S.strikes[id]||[]).includes(i))});
  paintProg();
}
function toggleStrike(oi){
  const id=currentQ().id; const s=S.strikes[id]||[];
  S.strikes[id]=s.includes(oi)?s.filter(x=>x!==oi):s.concat(oi); saveSoon();
  const el=$(`.opt[data-i="${oi}"]`); if(el) el.classList.toggle('struck',S.strikes[id].includes(oi));
}
function toggleFlag(){const id=currentQ().id;S.flags[id]=!S.flags[id];if(!S.flags[id])delete S.flags[id];saveSoon();renderExam()}
function setFs(d){S.fs=Math.min(1.5,Math.max(0.85,Math.round(((S.fs||1)+d)*100)/100));saveSoon();const m=$('#xmain');if(m)m.style.setProperty('--qsize',S.fs)}

function doHighlight(stem,id){
  const sel=window.getSelection(); if(!sel||!sel.rangeCount||sel.isCollapsed) return;
  const r=sel.getRangeAt(0);
  if(!stem.contains(r.startContainer)||!stem.contains(r.endContainer)) return;
  try{
    const frag=r.extractContents();
    frag.querySelectorAll('mark').forEach(m=>m.replaceWith(...m.childNodes));
    const mk=document.createElement('mark'); mk.appendChild(frag); r.insertNode(mk);
  }catch(e){return}
  sel.removeAllRanges(); $$('mark',stem).forEach(m=>{if(!m.textContent)m.remove()}); stem.normalize(); storeHl(stem,id);
}
function storeHl(stem,id){
  if($('mark',stem)) S.hl[id]=stem.innerHTML; else delete S.hl[id];
  saveSoon(); const b=$('#bClr'); if(b) b.disabled=!S.hl[id];
}

/* ---------- التنقل ---------- */
function goNext(){
  if(S.nav){const i=S.nav.list.indexOf(S.cur); if(i>=0&&i<S.nav.list.length-1){S.cur=S.nav.list[i+1]} else return openReview()}
  else {const [,s1]=S.sections[S.sec]; if(S.cur<s1-1) S.cur++; else return openReview()}
  save(); renderExam(); scrollTopQ();
}
function goPrev(){
  if(S.nav){const i=S.nav.list.indexOf(S.cur); if(i>0) S.cur=S.nav.list[i-1]; else return}
  else {const [s0]=S.sections[S.sec]; if(S.cur>s0) S.cur--; else return}
  save(); renderExam(); scrollTopQ();
}
function scrollTopQ(){const m=$('#xmain'); if(m) m.scrollTop=0}
function openReview(){S.phase='review';S.nav=null;ui.hl=false;ui.strike=false;save();render()}

/* ---------- شاشة المراجعة ---------- */
function secIdx(){const [s0,s1]=S.sections[S.sec];const a=[];for(let i=s0;i<s1;i++)a.push(i);return a}
function renderReview(){
  const all=secIdx();
  const inc=all.filter(i=>!isAnswered(QMAP[S.qids[i]],S.answers[S.qids[i]]));
  const fl=all.filter(i=>S.flags[S.qids[i]]);
  const shown=ui.rvFilter==='inc'?inc:ui.rvFilter==='fl'?fl:all;
  const last=S.sec===S.sections.length-1;
  root.innerHTML=`<div class="app">${xbar(`<span>شاشة المراجعة · القسم <span class="num">${S.sec+1}</span> من <span class="num">${S.sections.length}</span></span>${timerHtml()}`)}
    <main class="xmain"><div class="inner" style="font-size:17px">
      <div class="rv-top"><div><h2>مراجعة أسئلة القسم ${S.sec+1}</h2>
        <p>انقر على أي سؤال للانتقال إليه، أو استخدم أزرار المراجعة. بعد الضغط على «إنهاء القسم» لن تتمكن من العودة إلى أسئلة هذا القسم.</p></div></div>
      <div class="chips" role="group" aria-label="تصفية الأسئلة">
        <button class="chip" type="button" data-f="all" aria-pressed="${ui.rvFilter==='all'}">الكل (${all.length})</button>
        <button class="chip" type="button" data-f="inc" aria-pressed="${ui.rvFilter==='inc'}">غير مكتمل (${inc.length})</button>
        <button class="chip" type="button" data-f="fl" aria-pressed="${ui.rvFilter==='fl'}">معلّم للمراجعة (${fl.length})</button>
      </div>
      ${shown.length?`<div class="tiles">${shown.map(i=>{const id=S.qids[i],q=QMAP[id],done=isAnswered(q,S.answers[id]),f=!!S.flags[id];
        return `<button class="tile ${done?'':'inc'} ${f?'fl':''}" type="button" data-q="${i}"><b>${i+1}</b><span class="st">${done?'مكتمل':(isTouched(q,S.answers[id])?'غير مكتمل':'لم تتم الإجابة')}${f?ICON.flagF:''}</span></button>`}).join('')}</div>`
        :`<div class="empty" style="background:var(--surface);border:1px solid var(--line);border-radius:8px">لا توجد أسئلة في هذه القائمة.</div>`}
      <div class="legend"><span>إطار متقطع: سؤال غير مكتمل</span><span>علامة برتقالية: سؤال معلّم للمراجعة</span></div>
      <div class="rv-actions">
        <button class="btn" id="rvAll" type="button">مراجعة الكل</button>
        <button class="btn" id="rvInc" type="button" ${inc.length?'':'disabled'}>مراجعة غير المكتمل</button>
        <button class="btn" id="rvFl" type="button" ${fl.length?'':'disabled'}>مراجعة المعلّم</button>
      </div>
    </div></main>
    <footer class="xfoot"><span style="color:var(--muted);font-size:14px">المجاب: <span class="num">${all.length-inc.length}</span> من <span class="num">${all.length}</span></span><div class="mid"></div>
      <button class="btn btn-primary" id="rvEnd" type="button">${last?'إنهاء الاختبار':'إنهاء القسم'}${ICON.next}</button></footer></div>`;
  bindTimer();
  $$('.chip').forEach(c=>c.onclick=()=>{ui.rvFilter=c.dataset.f;renderReview()});
  const startNav=(list,at)=>{if(!list.length)return;S.nav={list};S.cur=at!=null?at:list[0];S.phase='exam';save();render();scrollTopQ()};
  $$('.tile').forEach(t=>t.onclick=()=>startNav(shown,Number(t.dataset.q)));
  $('#rvAll').onclick=()=>startNav(all); $('#rvInc').onclick=()=>startNav(inc); $('#rvFl').onclick=()=>startNav(fl);
  $('#rvEnd').onclick=()=>{
    const msg = (inc.length?`عدد الأسئلة غير المكتملة في هذا القسم: ${inc.length}. `:'') + (last?'سيتم تسليم الاختبار وعرض النتيجة.':'لن تتمكن من العودة إلى أسئلة هذا القسم بعد إنهائه.');
    confirmBox(last?'إنهاء الاختبار؟':'إنهاء القسم '+(S.sec+1)+'؟',msg,[{label:'العودة للمراجعة'},{label:last?'إنهاء وتسليم':'إنهاء القسم',kind:'primary',fn:endSection}]);
  };
}
function endSection(){
  ui.rvFilter='all';
  if(S.sec>=S.sections.length-1) return finishExam('done');
  if(S.breaks){S.phase='break';S.brk=EX.breakMinutes*60;closeCalc();save();render()}
  else {S.sec++;S.cur=S.sections[S.sec][0];S.phase='exam';save();render()}
}

/* ---------- الاستراحة ---------- */
function renderBreak(){
  root.innerHTML=`<div class="app">${xbar(`<span>استراحة اختيارية</span><span>الوقت المتبقي للاختبار <span class="num ltr">${fmtTime(S.remaining)}</span></span>`)}
    <div class="center"><div class="break-card">
      <h2>انتهى القسم ${S.sec+1} من ${S.sections.length}</h2>
      <p>يمكنك أخذ استراحة لمدة ${EX.breakMinutes} دقائق. مؤقت الاختبار متوقف الآن، وعند انتهاء الاستراحة يبدأ القسم التالي تلقائيًا.</p>
      <div class="big-time num ltr" id="brkTime">${fmtTime(S.brk)}</div>
      <p style="font-size:14px">لن تتمكن من العودة إلى أسئلة الأقسام السابقة.</p>
      <div class="row"><button class="btn btn-primary btn-lg" id="brkGo" type="button">استئناف الاختبار</button></div>
    </div></div></div>`;
  $('#brkGo').onclick=endBreak;
}
function endBreak(){S.sec++;S.cur=S.sections[S.sec][0];S.phase='exam';S.brk=0;save();render()}

/* ---------- النتائج ---------- */
function bandsHtml(p){
  const r=ratingFor(p); const order=RATINGS.slice().reverse();
  return `<div class="bands" aria-label="المستوى: ${esc(r.label)}">${order.map(x=>`<div class="r-${esc(x.id)} ${x.id===r.id?'on':''}">${esc(x.label)}</div>`).join('')}</div>`;
}
function answerText(q,a){
  if(!isTouched(q,a)) return 'لم تتم الإجابة';
  if(q.type==='fill') return String(a);
  return '';
}
function renderResults(){
  const R=S.result||computeResult(); const r=ratingFor(R.pct);
  const ringColor=R.pass?'var(--ok)':'var(--bad)';
  const list=S.qids.map((id,i)=>({id,i,q:QMAP[id],a:S.answers[id]})).filter(x=>{
    if(ui.resDomain!=='all'&&x.q.domain!==ui.resDomain) return false;
    const ok=isCorrect(x.q,x.a), done=isAnswered(x.q,x.a);
    if(ui.resFilter==='wrong') return !ok; if(ui.resFilter==='right') return ok;
    if(ui.resFilter==='blank') return !done; if(ui.resFilter==='flag') return !!S.flags[x.id];
    return true;
  });
  const reason={time:'انتهى الوقت وسُلّم الاختبار تلقائيًا.',manual:'أنهيت الاختبار قبل إكمال جميع الأقسام.',done:'أكملت جميع أقسام الاختبار.'}[S.endReason]||'';
  root.innerHTML=`<div class="page">
    <section class="band"><div class="wrap" style="padding-block:30px 34px">
      <div class="res-head"><div>
        <div class="eyebrow">تقرير الأداء · ${esc(S.name)} · ${esc(fmtDate(S.finished||Date.now()))}</div>
        <div class="verdict" style="font-family:var(--f-display);margin-top:6px">${R.pass?'ناجح':'غير ناجح'} <span style="font-size:.55em;font-weight:500;opacity:.85">(نتيجة تقديرية)</span></div>
        <p class="lead">المستوى العام: <b>${esc(r.label)}</b>. ${esc(reason)}</p>
      </div>
      <div class="score-ring" style="background:conic-gradient(${ringColor} ${R.pct*3.6}deg, rgba(255,255,255,.18) 0)"><div style="width:78%;height:78%;border-radius:50%;background:var(--brand);display:grid;place-items:center"><div><b class="num">${Math.round(R.pct)}%</b><small>${R.correct} من ${R.total}</small></div></div></div>
      </div></div></section>
    <main class="wrap" style="padding-block:24px">
      <div class="card" style="box-shadow:none">
        <h2>الأداء حسب المجال</h2>
        <div class="report">
          <div class="rp-row"><div class="rp-h"><b>الأداء العام</b><span class="num">${R.correct}/${R.total} · ${R.pct}%</span></div>${bandsHtml(R.pct)}</div>
          ${Object.keys(DOMAINS).filter(k=>R.per[k]&&R.per[k].total).map(k=>{const d=R.per[k],p=Math.round(d.correct/d.total*1000)/10;
            return `<div class="rp-row"><div class="rp-h"><b>${esc(DOMAINS[k].label)}</b><span class="num">${d.correct}/${d.total} · ${p}%</span></div>${bandsHtml(p)}</div>`}).join('')}
        </div>
        <p class="note">حد النجاح المستخدم في هذا المحاكي ${EX.passPercent}%. لا تعلن PMI نسبة نجاح رسمية، ويعتمد تقرير الاختبار الفعلي على مستويات الأداء الأربعة.</p>
      </div>
      <div class="stats" style="margin-top:16px">
        <div class="stat"><b class="num">${R.answered}/${R.total}</b><span>أسئلة مجابة</span></div>
        <div class="stat"><b class="num">${R.total-R.correct}</b><span>إجابات خاطئة أو ناقصة</span></div>
        <div class="stat"><b class="num">${R.flagged}</b><span>أسئلة معلّمة</span></div>
        <div class="stat"><b class="num">${fmtDur(R.timeUsed)}</b><span>الوقت المستخدم من ${fmtDur(S.total)}</span></div>
      </div>
      ${sheetOn()?`<p class="note">أُرسلت نتيجتك إلى المدرّب تلقائيًا.</p>`:''}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
        <button class="btn btn-primary" id="resNew" type="button">اختبار جديد</button>
        <button class="btn" id="resHome" type="button">الصفحة الرئيسية</button>
      </div>

      <h2 class="sec-title">مراجعة الإجابات</h2>
      <div class="filters">
        <div class="chips" style="margin:0" role="group" aria-label="تصفية حسب النتيجة">
          ${[['all','الكل'],['wrong','الخاطئة'],['right','الصحيحة'],['blank','دون إجابة'],['flag','المعلّمة']].map(([k,l])=>`<button class="chip" type="button" data-rf="${k}" aria-pressed="${ui.resFilter===k}">${l}</button>`).join('')}
        </div>
        <label for="resDom" style="font-size:14px;color:var(--muted)">المجال</label>
        <select id="resDom"><option value="all">كل المجالات</option>${Object.keys(DOMAINS).map(k=>`<option value="${k}" ${ui.resDomain===k?'selected':''}>${esc(DOMAINS[k].label)}</option>`).join('')}</select>
        <span style="font-size:14px;color:var(--muted)" class="num">${qCount(list.length)}</span>
      </div>
      <div class="ans-list">${list.length?list.map(x=>ansCard(x)).join(''):'<div class="empty" style="background:var(--surface);border:1px solid var(--line);border-radius:8px">لا توجد أسئلة في هذه القائمة.</div>'}</div>
    </main>
    <footer class="wrap foot">محاكاة تدريبية مستقلة لأغراض التعليم، وليست تابعة لمعهد إدارة المشاريع PMI.</footer>
  </div>`;
  $('#resNew').onclick=()=>{store.del(K_SESSION);S=null;renderHome();window.scrollTo(0,0)};
  $('#resHome').onclick=()=>{S=null;renderHome();window.scrollTo(0,0)};
  $$('[data-rf]').forEach(c=>c.onclick=()=>{ui.resFilter=c.dataset.rf;renderResults()});
  $('#resDom').onchange=e=>{ui.resDomain=e.target.value;renderResults()};
}
function ansCard({id,i,q,a}){
  const ok=isCorrect(q,a), done=isAnswered(q,a);
  const status = ok?'<span class="pill ok">صحيحة</span>':(done?'<span class="pill bad">خاطئة</span>':'<span class="pill bad">دون إجابة مكتملة</span>');
  let body='';
  if(q.type==='single'||q.type==='multi'){
    const order=S.optOrder[id]||q.options.map((_,k)=>k);
    const corr=q.type==='multi'?q.answer.map(Number):[Number(q.answer)];
    const mine=q.type==='multi'?(Array.isArray(a)?a:[]):(a==null?[]:[a]);
    body=`<ul>${order.map((oi,pos)=>{const c=corr.includes(oi),m=mine.includes(oi);
      return `<li class="${c?'correct':(m?'wrong':'')}"><b>${LETTERS[pos]||pos+1}</b><span>${txt(q.options[oi])}</span>${c?`<span class="tag">${m?'إجابتك · صحيحة':'الإجابة الصحيحة'}</span>`:(m?'<span class="tag">إجابتك</span>':'')}</li>`}).join('')}</ul>`;
  } else if(q.type==='match'){
    body=`<ul>${q.items.map((it,k)=>{const m=Array.isArray(a)?a[k]:null,c=q.answer[k],good=m!=null&&Number(m)===Number(c);
      return `<li class="${good?'correct':'wrong'}"><span><b>${txt(it)}</b> ← ${esc(q.targets[c])}${good?'':`<br><small style="color:var(--muted)">إجابتك: ${m==null?'لم تُحدد':esc(q.targets[m])}</small>`}</span></li>`}).join('')}</ul>`;
  } else if(q.type==='fill'){
    body=`<ul><li class="correct"><span>الإجابة الصحيحة: <b class="num ltr">${esc(q.answer)}</b></span></li>${ok?'':`<li class="wrong"><span>إجابتك: <b class="num ltr">${esc(answerText(q,a))}</b></span></li>`}</ul>`;
  }
  return `<article class="ans ${ok?'ok':'bad'}"><div class="ah"><b>السؤال ${i+1}</b><span>${esc(DOMAINS[q.domain].label)}</span>${status}${S.flags[id]?'<span style="color:var(--accent);font-weight:600">معلّم</span>':''}</div>
    <div class="aq">${txt(q.q)}</div>${body}${q.explanation?`<div class="ex"><b>الشرح: </b>${txt(q.explanation)}</div>`:''}</article>`;
}

/* ================= الآلة الحاسبة ================= */
const calcEl=$('#calc');
const C={d:'0',acc:null,op:null,fresh:true,expr:''};
function calcHtml(){
  const keys=[['C','CE','⌫','÷'],['7','8','9','×'],['4','5','6','−'],['1','2','3','+'],['±','0','.','='],['√','%']];
  calcEl.innerHTML=`<div class="calc-h" id="calcH"><span>الآلة الحاسبة</span><button type="button" id="calcX" aria-label="إغلاق الآلة الحاسبة">×</button></div>
    <div class="calc-d" aria-live="polite"><small id="calcE"></small><span id="calcD">0</span></div>
    <div class="calc-k">${keys.flat().map(k=>`<button type="button" data-k="${k}" class="${'÷×−+'.includes(k)?'op':''} ${k==='='?'eq':''}">${k}</button>`).join('')}</div>`;
  $$('.calc-k button',calcEl).forEach(b=>b.onclick=()=>calcPress(b.dataset.k));
  $('#calcX').onclick=()=>{closeCalc();const b=$('#bCalc');if(b)b.setAttribute('aria-pressed','false')};
  dragify($('#calcH'));
}
function cfmt(n){if(!isFinite(n))return 'خطأ';return String(parseFloat(n.toPrecision(12)))}
function cnum(){return parseFloat(C.d)||0}
function capply(a,op,b){return op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:op==='÷'?(b===0?NaN:a/b):b}
function calcPress(k){
  if(C.d==='خطأ'&&k!=='C'){C.d='0';C.acc=null;C.op=null;C.fresh=true;C.expr=''}
  if(/^\d$/.test(k)){ if(C.fresh){C.d=k;C.fresh=false} else C.d=(C.d==='0'?k:C.d+k).slice(0,16) }
  else if(k==='.'){ if(C.fresh){C.d='0.';C.fresh=false} else if(!C.d.includes('.')) C.d+='.' }
  else if('÷×−+'.includes(k)){
    if(C.op!=null && !C.fresh){C.acc=capply(C.acc,C.op,cnum());C.d=cfmt(C.acc)} else if(C.op==null) C.acc=cnum();
    C.op=k; C.fresh=true; C.expr=cfmt(C.acc)+' '+k;
  }
  else if(k==='='){ if(C.op!=null){const b=cnum();C.expr=cfmt(C.acc)+' '+C.op+' '+cfmt(b)+' =';C.d=cfmt(capply(C.acc,C.op,b));C.op=null;C.acc=null;C.fresh=true} }
  else if(k==='C'){C.d='0';C.acc=null;C.op=null;C.fresh=true;C.expr=''}
  else if(k==='CE'){C.d='0';C.fresh=true}
  else if(k==='⌫'){ if(!C.fresh){C.d=C.d.length>1?C.d.slice(0,-1):'0'; if(C.d==='-')C.d='0'} }
  else if(k==='±'){C.d=cfmt(-cnum())}
  else if(k==='√'){C.d=cfmt(Math.sqrt(cnum()));C.fresh=true}
  else if(k==='%'){C.d=cfmt(C.op!=null&&C.acc!=null?C.acc*cnum()/100:cnum()/100);C.fresh=true}
  $('#calcD').textContent=C.d; $('#calcE').textContent=C.expr;
}
function toggleCalc(){
  if(!calcEl.innerHTML) calcHtml();
  calcEl.hidden=!calcEl.hidden;
  if(!calcEl.hidden && !calcEl.style.top){
    const w=window.innerWidth; calcEl.style.top=Math.min(140,window.innerHeight-380)+'px';
    calcEl.style.left=Math.max(12,Math.min(w-268,24))+'px';
  }
}
function closeCalc(){calcEl.hidden=true}
function dragify(h){
  let sx,sy,ox,oy,on=false;
  h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;on=true;sx=e.clientX;sy=e.clientY;const r=calcEl.getBoundingClientRect();ox=r.left;oy=r.top;h.setPointerCapture(e.pointerId)});
  h.addEventListener('pointermove',e=>{if(!on)return;const x=Math.max(0,Math.min(window.innerWidth-calcEl.offsetWidth,ox+e.clientX-sx)),y=Math.max(0,Math.min(window.innerHeight-calcEl.offsetHeight,oy+e.clientY-sy));calcEl.style.left=x+'px';calcEl.style.top=y+'px'});
  h.addEventListener('pointerup',()=>{on=false});
}
calcEl.addEventListener('keydown',e=>{
  const map={'Enter':'=','=':'=','Backspace':'⌫','Escape':'C','*':'×','/':'÷','-':'−','+':'+','.':'.'};
  const k=/^\d$/.test(e.key)?e.key:map[e.key]; if(k){e.preventDefault();e.stopPropagation();calcPress(k)}
});

/* ================= النوافذ والتنبيهات ================= */
const overlay=$('#overlay');
function confirmBox(title,msg,actions){
  const prev=document.activeElement;
  overlay.innerHTML=`<div class="modal-back" role="dialog" aria-modal="true" aria-labelledby="mdT"><div class="modal"><h3 id="mdT">${esc(title)}</h3><p>${esc(msg)}</p>
    <div class="row">${actions.map((a,i)=>`<button type="button" class="btn ${a.kind==='primary'?'btn-primary':a.kind==='danger'?'btn-danger':''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</div></div></div>`;
  const close=()=>{overlay.innerHTML='';if(prev&&prev.focus&&document.contains(prev))prev.focus()};
  $$('[data-a]',overlay).forEach(b=>b.onclick=()=>{const a=actions[Number(b.dataset.a)];close();if(a.fn)a.fn()});
  $('.modal-back',overlay).addEventListener('click',e=>{if(e.target.classList.contains('modal-back'))close()});
  const btns=$$('[data-a]',overlay); (btns[btns.length-1]||btns[0]).focus();
  overlay._close=close;
}
let toastT=null;
function toast(m){
  let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true},3200);
}

/* ================= لوحة المفاتيح ================= */
document.addEventListener('keydown',e=>{
  if(overlay.innerHTML){ if(e.key==='Escape'&&overlay._close) overlay._close(); return; }
  if(!S||S.phase!=='exam') return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'||e.target.closest&&e.target.closest('#calc')) return;
  if(e.altKey&&e.code==='KeyN'){e.preventDefault();goNext();return}
  if(e.altKey&&e.code==='KeyP'){e.preventDefault();goPrev();return}
  if(e.altKey&&e.code==='KeyF'){e.preventDefault();toggleFlag();return}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const d='123456789'.indexOf(e.key)>=0?Number(e.key):('١٢٣٤٥٦٧٨٩'.indexOf(e.key)+1);
  if(d>0){const q=currentQ(); if(q.type!=='single'&&q.type!=='multi')return; const order=S.optOrder[q.id]||q.options.map((_,i)=>i); if(d<=order.length){e.preventDefault(); ui.strike?toggleStrike(order[d-1]):choose(q,order[d-1])}}
});

/* عند فتح الصفحة تظهر الرئيسية دائمًا، مع خيار متابعة الاختبار المحفوظ أو عرض آخر نتيجة */
S=null;
flushOutbox();
render();
})();
</script>
